<div class="home-container">
  <section class="hero">
    <div class="hero-bg-slider">
      <div
        class="hero-bg-layer"
        *ngFor="let url of heroBgUrls; let i = index"
        [class.is-active]="i === heroBgActiveIndex"
        [ngStyle]="{
          'background-image': 'radial-gradient(900px circle at 18% 20%, rgba(0, 255, 163, 0.14), transparent 60%), radial-gradient(800px circle at 82% 18%, rgba(61, 211, 56, 0.10), transparent 62%), url(' + url + ')'
        }"
        aria-hidden="true"></div>
    </div>
    <div class="hero-content">
      <div class="hero-grid">
        <div class="hero-copy">
          <span class="hero-badge">Artesanal • Natural • Premium</span>
          <h1>Mate Tierra</h1>
          <p>Productos para mate con esencia natural: mates artesanales, hierbas seleccionadas y termos listos para acompañarte todos los días.</p>

          <div class="hero-buttons">
            <a routerLink="/productos" class="hero-button primary">
              <i class="fas fa-shopping-bag"></i> Explorar catálogo
            </a>
            <a class="hero-button secondary" href="https://wa.me/5493758459113?text=Hola%20Mate%20Tierra%2C%20quiero%20consultar%20por%20el%20cat%C3%A1logo" target="_blank" rel="noopener">
              <i class="fab fa-whatsapp"></i> Contactar por WhatsApp
            </a>
          </div>

          <div class="hero-highlights" aria-label="Beneficios">
            <div class="highlight">
              <i class="fas fa-seedling"></i>
              <span>Selección natural</span>
            </div>
            <div class="highlight">
              <i class="fas fa-hands"></i>
              <span>Mates artesanales</span>
            </div>
            <div class="highlight">
              <i class="fas fa-truck"></i>
              <span>Envíos a todo el país</span>
            </div>
          </div>
        </div>

        <div class="hero-media">
          <figure class="hero-frame" aria-label="Galería de mates destacados">
            <div class="hero-frame-media">
              <div
                class="hero-image-layer"
                *ngFor="let image of mateImages; let i = index; trackBy: trackByImage"
                [class.is-active]="i === activeImageIndex"
                [style.backgroundImage]="'url(' + image + ')'"
                role="presentation"></div>
              <div class="hero-frame-sheen"></div>
              <div class="hero-chip">
                <i class="fas fa-mug-hot" aria-hidden="true"></i>
                Mates destacados
              </div>
            </div>
            <figcaption class="hero-frame-caption">
              <span class="hero-frame-kicker">Colección Mates</span>
              <span class="hero-frame-title">Probá el mate que te está esperando</span>
              <span class="hero-frame-sub">Elegí tu favorito y sentí el aroma a tradición apenas lo veas.</span>
              <div class="hero-dots" *ngIf="mateImages.length > 1" role="group" aria-label="Cambiar imagen de mate">
                <button
                  type="button"
                  class="hero-dot"
                  *ngFor="let image of mateImages; let i = index; trackBy: trackByImage"
                  [class.active]="i === activeImageIndex"
                  (click)="goToImage(i)"
                  [attr.aria-pressed]="i === activeImageIndex"
                  [attr.aria-label]="'Mostrar imagen ' + (i + 1)">
                </button>
              </div>
            </figcaption>
          </figure>
        </div>
      </div>
    </div>
  </section>

  
    <section class="seasonal-products">
      <div class="container">
        <app-product-carousel></app-product-carousel>
      </div>
    </section>

  <app-categories-section></app-categories-section>

  <app-features-section></app-features-section>
</div>
