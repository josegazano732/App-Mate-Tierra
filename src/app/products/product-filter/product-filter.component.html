<div class="filter">
  <div class="filter-field">
    <label for="products-search">Buscar</label>
    <div class="search-container">
      <i class="fas fa-search search-icon"></i>
      <input id="products-search"
             type="text"
             [(ngModel)]="searchValue"
             (ngModelChange)="onSearchInput()"
             placeholder="Ej. mate camionero, termo, bombilla">
    </div>
  </div>

  <div class="filter-field">
    <label for="products-category">Categoría</label>
    <select id="products-category" [(ngModel)]="categoryValue" (ngModelChange)="onFilterChange()">
      <option value="">Todas las categorías</option>
      <option *ngFor="let category of categories" [value]="category.name">
        {{ category.name }}
      </option>
    </select>
  </div>
</div>
